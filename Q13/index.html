<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>Notes Application</h2>
    </header>

    <main>
        <textarea id="noteField" placeholder="Write your notes here..."></textarea>

        <section class="controls">
            <button id="btnSave">Store Notes</button>
            <button id="btnLoad">Retrieve Notes</button>
            <button id="btnClear">Erase Notes</button>
        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
